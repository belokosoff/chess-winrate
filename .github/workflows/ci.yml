name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node test/test.js
      - name: Build packages
        run: node scripts/build.js
      - name: Lint the Firefox build
        run: npx --yes web-ext@8 lint --source-dir dist/firefox
